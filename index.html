<!doctype html>
<html lang="en" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14040b" />
    <!-- PWA: lets Edge/Chrome install ROSE as an app window with its own icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ROSE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Project ROSE</title>
    <script>
      // Apply the saved theme before React loads so the page never flashes the wrong colours.
      try {
        var html = document.documentElement
        var saved = localStorage.getItem('rose.theme') || localStorage.getItem('febvy.theme')
        if (saved) html.dataset.theme = saved
        // Keep in sync with the groups in src/theme/themes.ts.
        var groups = { midnight: 'modern', dusk: 'modern', frost: 'modern', paper: 'modern', glass: 'modern',
          mesh: 'animated', daynight: 'animated', isometric: 'animated', bloom: 'animated' }
        if (groups[saved]) html.dataset.themeGroup = groups[saved]
        // Day / Night palette - keep in sync with phaseOf() in src/theme/animated/phase.ts.
        var h = new Date().getHours()
        html.dataset.phase = h >= 5 && h < 7 ? 'dawn' : h >= 7 && h < 17 ? 'day' : h >= 17 && h < 19 ? 'sunset' : 'night'
        if (localStorage.getItem('rose.motion') === 'off') html.dataset.motion = 'off'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
